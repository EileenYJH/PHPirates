<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PHPirates Swarm</title>
<style>
  :root { --bg:#0f1720; --panel:#17212d; --ink:#e6edf3; --muted:#8b98a7;
          --red:#e5484d; --amber:#f5a524; --green:#30a46c; --blue:#5b8def; --line:#26323f;
          --add:#13351f; --del:#3a1b1f; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:14px/1.45 system-ui, sans-serif; }
  header { padding:14px 20px; border-bottom:1px solid var(--line); display:flex; gap:20px; align-items:center; flex-wrap:wrap; }
  h1 { margin:0; font-size:19px; white-space:nowrap; }
  #summary { color:var(--muted); }
  .stats { display:flex; gap:10px; margin-left:auto; }
  .stat { background:var(--panel); border:1px solid var(--line); border-radius:9px; padding:6px 14px; min-width:92px; text-align:center; }
  .stat .v { font-size:19px; font-weight:700; }
  .stat .l { font-size:10px; color:var(--muted); text-transform:uppercase; letter-spacing:.04em; }
  #status { font-size:12px; color:var(--muted); width:100%; text-align:right; }
  #status.bad { color:var(--red); font-weight:600; }
  main { display:grid; grid-template-columns: 1fr 240px; gap:16px; padding:16px 20px; }
  @media (max-width: 820px) { main { grid-template-columns: 1fr; } .stats { margin-left:0; } }
  .servers { display:grid; grid-template-columns: repeat(auto-fill, minmax(460px, 1fr)); gap:16px; align-content:start; }
  .server, .agents { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:12px; }
  .server h2, .agents h2 { margin:0 0 10px; font-size:15px; }
  .ticket { border-left:5px solid var(--red); background:#1d2836; border-radius:6px; padding:10px 12px; margin-bottom:10px; }
  .ticket.amber { border-color:var(--amber); }
  .ticket.green { border-color:var(--green); }
  .ticket.orphaned { border-color:var(--red); border-left-style:dashed; }
  .ticket.review { border-color:var(--blue); }
  .ticket.approved { border-color:var(--blue); border-left-style:dashed; }
  .row { display:flex; justify-content:space-between; gap:8px; align-items:center; }
  .badge { font-size:11px; padding:1px 7px; border-radius:99px; font-weight:600; text-transform:uppercase; white-space:nowrap; }
  .red .badge, .orphaned .badge { background:var(--red); }
  .amber .badge { background:var(--amber); color:#000; }
  .green .badge { background:var(--green); }
  .review .badge, .approved .badge { background:var(--blue); }
  .meta { color:var(--muted); font-size:12px; margin-top:4px; word-break:break-word; }
  .notes { margin:6px 0 0; padding-left:16px; color:var(--muted); font-size:11px; }
  details { margin-top:6px; }
  summary { cursor:pointer; color:var(--blue); font-size:12px; }
  pre.diff { margin:6px 0 0; padding:10px; background:#0c131b; border-radius:6px;
             font:12px/1.5 ui-monospace, monospace;
             white-space:pre-wrap; overflow-wrap:anywhere; }
  pre.diff .a { color:#6ee7a8; background:var(--add); display:block; }
  pre.diff .d { color:#ff9ba1; background:var(--del); display:block; }
  pre.diff .h { color:#7aa2d6; display:block; }
  .actions { display:flex; gap:8px; margin-top:8px; }
  button { border:0; border-radius:7px; padding:5px 14px; font-weight:600; cursor:pointer; color:#fff; font-size:12px; }
  .ok { background:var(--green); } .no { background:var(--red); }
  .agent { padding:6px 0; border-bottom:1px solid var(--line); font-size:12px; }
  .agent:last-child { border:0; }
  .agent b { font-family:ui-monospace, monospace; }
</style>
</head>
<body>
<header>
  <h1>PHPirates swarm</h1>
  <span id="summary">loading…</span>
  <div class="stats">
    <div class="stat"><div class="v" id="m-tp">–</div><div class="l">patches/min</div></div>
    <div class="stat"><div class="v" id="m-eff">–</div><div class="l">effectiveness</div></div>
    <div class="stat"><div class="v" id="m-done">–</div><div class="l">patched</div></div>
  </div>
  <span id="status"></span>
</header>
<main>
  <section class="servers" id="servers"></section>
  <aside class="agents"><h2>Agents alive</h2><div id="agents"></div></aside>
</main>
<script>
// Approvals service lives next to the dashboard on :5001 (same host).
const APPROVALS = `http://${location.hostname}:5001`;
const LABEL = { red:"open", amber:"patching", green:"patched", orphaned:"lease expired",
                review:"awaiting approval", approved:"approved" };
// The page re-renders every 2s; remember which diffs the user opened so they stay open.
const openDiffs = new Set();
// Only rebuild the ticket/agent DOM when it actually changed, to stop the flicker.
let lastSig = null;

function updateMetrics(m) {
  document.getElementById("m-tp").textContent = (m.patches_per_min || 0).toFixed(1);
  document.getElementById("m-eff").textContent =
    m.effectiveness == null ? "–" : Math.round(m.effectiveness * 100) + "%";
  document.getElementById("m-done").textContent = `${m.green || 0}/${m.total || 0}`;
}

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}
function colorize(diff) {
  const pre = el("pre", "diff");
  (diff || "").split("\n").forEach(line => {
    let cls = "";
    if (line.startsWith("+++") || line.startsWith("---") || line.startsWith("@@")) cls = "h";
    else if (line[0] === "+") cls = "a";
    else if (line[0] === "-") cls = "d";
    pre.appendChild(el("span", cls, line + "\n"));
  });
  return pre;
}
async function decide(action, key) {
  try {
    await fetch(`${APPROVALS}/api/${action}`, {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ key, reviewer: "dashboard", reason: "via dashboard" })
    });
  } catch (e) { alert("Could not reach approvals service on :5001 — " + e.message); }
  poll();
}

function render(data) {
  const byServer = {};
  for (const t of data.tickets) (byServer[t.server] ||= []).push(t);
  const counts = { red:0, amber:0, green:0, orphaned:0, review:0, approved:0 };
  data.tickets.forEach(t => counts[t.view]++);
  document.getElementById("summary").textContent =
    `${counts.green}/${data.tickets.length} patched · ${counts.amber + counts.review + counts.approved} in progress · ${counts.red + counts.orphaned} open`;

  const servers = document.getElementById("servers");
  servers.replaceChildren();
  for (const sid of Object.keys(byServer).sort()) {
    const box = el("div", "server");
    box.append(el("h2", "", "Server " + sid));
    for (const t of byServer[sid]) {
      const card = el("div", "ticket " + t.view);
      const row = el("div", "row");
      row.append(el("strong", "", `${t.vuln} (${t.type})`), el("span", "badge", LABEL[t.view]));
      card.append(row);
      let meta = "";
      if (t.view === "amber") meta = `held by ${t.holder} · lease ${t.lease_left}s`;
      if (t.view === "orphaned") meta = `${t.claimed_by} stopped renewing; free to claim`;
      if (t.view === "review") meta = `patch by ${t.proposed_by || "?"} · awaiting approval`;
      if (t.view === "approved") meta = `approved by ${t.approved_by || "?"} · applying…`;
      if (t.view === "green") meta = `patched by ${t.patched_by || "?"}${t.approved_by ? " · approved by " + t.approved_by : ""} · ${t.verified || ""}`;
      if (meta) card.append(el("div", "meta", meta));

      if (t.proposed_diff) {
        const d = el("details");
        d.open = openDiffs.has(t.key);
        d.addEventListener("toggle", () => {
          if (d.open) openDiffs.add(t.key); else openDiffs.delete(t.key);
        });
        d.append(el("summary", "", t.view === "review" ? "review diff" : "view diff"));
        d.append(colorize(t.proposed_diff));
        card.append(d);
      }
      if (t.view === "review") {
        const act = el("div", "actions");
        const ok = el("button", "ok", "Approve"); ok.onclick = () => decide("approve", t.key);
        const no = el("button", "no", "Reject");  no.onclick = () => decide("reject", t.key);
        act.append(ok, no);
        card.append(act);
      }
      if (t.attempts && t.attempts.length) {
        const ul = el("ul", "notes");
        t.attempts.slice(-4).forEach(a => ul.append(el("li", "", a)));
        card.append(ul);
      }
      box.append(card);
    }
    servers.append(box);
  }

  const agents = document.getElementById("agents");
  agents.replaceChildren();
  if (!data.agents.length) agents.append(el("div", "meta", "none"));
  for (const a of data.agents) {
    const d = el("div", "agent");
    d.append(el("b", "", a.id));
    d.append(el("div", "meta", `[${a.specialisms.join(", ")}] ${a.working_on ? "→ " + a.working_on : "idle"}`));
    agents.append(d);
  }
}

async function poll() {
  const status = document.getElementById("status");
  try {
    const res = await fetch("api/state", { cache: "no-store" });
    const data = await res.json();
    if (!data.ok) throw new Error(data.error);
    updateMetrics(data.metrics || {});
    const sig = JSON.stringify(data.tickets) + "|" + JSON.stringify(data.agents);
    if (sig !== lastSig) { lastSig = sig; render(data); }
    status.className = "";
    status.textContent = "updated " + new Date().toLocaleTimeString();
  } catch (e) {
    status.className = "bad";
    status.textContent = "Redis unreachable: " + e.message;
  }
}
poll();
setInterval(poll, 2000);
</script>
</body>
</html>
